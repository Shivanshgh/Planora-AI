services:
  - type: web
    name: planora-ai
    runtime: node
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: BUN_VERSION
        value: 1.4.4
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
